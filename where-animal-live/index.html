<style>
body.gate{--bg:#e6f2f0;--card:#fbfdfc;--ink:#1c3441;--muted:#4d6672;--tens:#c9531d;--ones:#f5cf4a;--sea:#a9d8e6;--edge:#c9dedb;--bad:#b42318}
@media (prefers-color-scheme:dark){body.gate{--bg:#0f2028;--card:#172d37;--ink:#eef6f5;--muted:#a8c0c7;--tens:#ff8a52;--ones:#e1bd3d;--sea:#1d4a5d;--edge:#071218;--bad:#ff9b8f;color-scheme:dark}}
html:has(body.gate){height:100%}
body.gate{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;min-height:100%;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.gate form{width:100%;max-width:380px;background:var(--card);border-radius:28px;padding:28px;box-sizing:border-box;box-shadow:0 6px 0 var(--edge);display:flex;flex-direction:column;gap:16px;margin-block:24px}
.gate h1{margin:0;font-size:30px;font-weight:600;display:flex;align-items:center;gap:12px}
.gate p{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
.gate label{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gate input[type=password]{font:inherit;font-size:20px;padding:14px 16px;border-radius:16px;border:3px solid var(--bg);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.gate input[type=password]:focus{outline:none;border-color:var(--tens)}
.gate .row{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.gate .row input{width:22px;height:22px;accent-color:var(--tens)}
.gate button{border:0;background:var(--tens);color:#fff;border-radius:18px;padding:15px;font:inherit;font-size:20px;font-weight:600;box-shadow:0 5px 0 var(--edge);cursor:pointer}
.gate button:disabled{opacity:.5}
.gate .err{color:var(--bad);font-weight:500}
.gate :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.gate button.link{background:none;color:var(--tens);box-shadow:none;padding:4px 0;font-size:16px;text-decoration:underline;align-self:flex-start}
</style>

<script>
const SALT = "d2hlcmUtYW5pbWFscy12MQ==", IV = "MF32PlzRRho9f/Rb", ITER = 600000, BUILT_IN_KEY = "V/kew2Q+wfaH8bhI63E511VO5jr9WPBRLyad4AgUxww=";
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_STORE = 'where-animals-key';
async function openWith(key){
  const data = bytes(document.getElementById('payload').textContent.trim());
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, data);
  const html = new TextDecoder().decode(plain);
  // document.open() only replaces the start screen once the page has finished loading; before that it adds to it.
  if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
  document.open(); document.write(html); document.close();
}
async function keyFromPassword(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' }, base,
    { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
const rawToB64 = raw => btoa(String.fromCharCode(...raw));
(async () => {
  // 1) the share link: #k=<key>
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if (m){
    try{
      const s = m[1].replace(/-/g,'+').replace(/_/g,'/'); const raw = bytes(s + '==='.slice((s.length + 3) % 4));
      const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['decrypt']);
      try{ localStorage.setItem(KEY_STORE, rawToB64(raw)); }catch(_){}
      await openWith(key); return;
    }catch(e){}
  }
  // 2) a key this device remembered
  let saved = null; try{ saved = localStorage.getItem(KEY_STORE); }catch(e){}
  if (saved){
    try{ await openWith(await crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', true, ['decrypt'])); return; }
    catch(e){ try{ localStorage.removeItem(KEY_STORE); }catch(_){} }
  }
  // 3) no password needed: the key is built into the page
  try{ await openWith(await crypto.subtle.importKey('raw', bytes(BUILT_IN_KEY), 'AES-GCM', false, ['decrypt'])); return; }catch(e){}
  document.getElementById('lead').textContent = 'Where Animals Live could not open. Reload the page to try again.';
})();
document.getElementById('usepw').onclick = () => { document.getElementById('pwbox').hidden = false; document.getElementById('usepw').hidden = true; document.getElementById('pw').focus(); };
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; go.textContent = 'Opening…'; err.hidden = true;
  try{
    const key = await keyFromPassword(document.getElementById('pw').value);
    if (document.getElementById('remember').checked){
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      try{ localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); }catch(_){}
    }
    await openWith(key);
  }catch(ex){
    err.hidden = false; go.disabled = false; go.textContent = 'Open';
    try{ localStorage.removeItem(KEY_STORE); }catch(_){}
  }
});
</script>
