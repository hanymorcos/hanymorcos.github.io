<script>
(() => {
const IV = "xfHKm4iV5FOnyb7b", OPEN_KEY = "wpC0LbqyI6YZYquOzRDuCBgJ7CthJtkgaw8Y17KZp30", KEY_STORE = 'history-trail-key';
const fromB64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
async function tryKey(k){
  const key = await crypto.subtle.importKey('raw', fromB64(k), 'AES-GCM', false, ['decrypt']);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(IV) }, key, fromB64(document.getElementById('payload').textContent.trim()));
}
(async () => {
  const m = location.hash.match(/k=([A-Za-z0-9_-]{43})/);
  let saved = null; try{ saved = localStorage.getItem(KEY_STORE); }catch(e){}
  for (const k of [m && m[1], saved, OPEN_KEY].filter(Boolean)){
    try{
      const plain = await tryKey(k);
      try{ localStorage.setItem(KEY_STORE, k); }catch(e){}
      const html = new TextDecoder().decode(plain);
      if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
      document.querySelectorAll('style, link[rel=stylesheet]').forEach(n => n.remove());
      document.open(); document.write(html); document.close();
      return;
    }catch(e){}
  }
  document.getElementById('lead').textContent = "History Trail couldn't open. Reload the page to try again.";
})();
})();
</script>
