<script>
(() => {
const IV = "lCEHZfOMU3WKwvkH", SALT = "Pdfokn34quM8IOUM8v5mpQ==", ITER = 250000, KEY_STORE = 'safe-steps-pkey';
const fromB64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const data = () => fromB64(document.getElementById('payload').textContent.trim());
async function open(rawKey){
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: fromB64(IV) }, key, data());
  try{ localStorage.setItem(KEY_STORE, toB64(rawKey)); }catch(e){}
  const html = new TextDecoder().decode(plain);
  if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once:true }));
  document.querySelectorAll('style, link[rel=stylesheet]').forEach(n => n.remove());
  document.open(); document.write(html); document.close();
}
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt: fromB64(SALT), iterations: ITER }, base, 256);
}
const f = document.getElementById('f'), msg = document.getElementById('msg'), lead = document.getElementById('lead');
f.onsubmit = async e => {
  e.preventDefault(); msg.className = ''; msg.textContent = 'Checking…';
  try{ await open(await derive(document.getElementById('pw').value.trim().toLowerCase())); }
  catch(err){ msg.className = 'err'; msg.textContent = 'That password is not right. Try again.'; document.getElementById('pw').select(); }
};
(async () => {
  let saved = null; try{ saved = localStorage.getItem(KEY_STORE); }catch(e){}
  if (saved){ try{ await open(fromB64(saved)); return; }catch(e){ try{ localStorage.removeItem(KEY_STORE); }catch(_){} } }
  lead.hidden = true; f.hidden = false; document.getElementById('pw').focus();
})();
})();
</script>
