const fromB64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const decrypt = async raw => crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(IV) },
  await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']), fromB64(document.getElementById('payload').textContent.trim()));
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(SALT), iterations: ITER }, base, 256);
}
async function open(raw){
  const html = new TextDecoder().decode(await decrypt(raw));
  try{ localStorage.setItem(KEY_STORE, toB64(raw)); }catch(e){}
  if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
  document.querySelectorAll('style, link[rel=stylesheet]').forEach(n => n.remove());
  document.open(); document.write(html); document.close();
}
(async () => {
  let saved = null; try{ saved = localStorage.getItem(KEY_STORE); }catch(e){}
  if (saved){ try{ await open(fromB64(saved)); return; }catch(e){ try{ localStorage.removeItem(KEY_STORE); }catch(_){} } }
  document.getElementById('lead').hidden = true;
  const f = document.getElementById('f'), msg = document.getElementById('msg'), pw = document.getElementById('pw');
  f.hidden = false; pw.focus();
  f.addEventListener('submit', async e => {
    e.preventDefault(); msg.textContent = 'Checking…';
    try{ await open(await derive(pw.value)); }
    catch(err){ msg.textContent = 'Not quite. Try again.'; pw.select(); }
  });
})();
})();
</script>
</body></html>
